plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

def similarityKeystoreProps = new Properties()
def similarityKeystorePropsFile = rootProject.file("keystore.properties")
if (similarityKeystorePropsFile.exists()) {
    similarityKeystorePropsFile.withInputStream { similarityKeystoreProps.load(it) }
}

// Android Studio "Generate Signed Bundle / APK" injects these Gradle properties at build time.
def similarityInjectedStoreFile = project.findProperty("android.injected.signing.store.file")?.toString()?.trim()
def similarityInjectedStorePassword = project.findProperty("android.injected.signing.store.password")?.toString()?.trim()
def similarityInjectedKeyAlias = project.findProperty("android.injected.signing.key.alias")?.toString()?.trim()
def similarityInjectedKeyPassword = project.findProperty("android.injected.signing.key.password")?.toString()?.trim()

def similarityReleaseStoreFile =
        (similarityInjectedStoreFile ?: System.getenv("SIMILARITY_KEYSTORE_PATH") ?: similarityKeystoreProps.getProperty("storeFile"))?.trim()
def similarityReleaseStorePassword =
        (similarityInjectedStorePassword ?: System.getenv("SIMILARITY_KEYSTORE_PASSWORD") ?: similarityKeystoreProps.getProperty("storePassword"))?.trim()
def similarityReleaseKeyAlias =
        (similarityInjectedKeyAlias ?: System.getenv("SIMILARITY_KEY_ALIAS") ?: similarityKeystoreProps.getProperty("keyAlias"))?.trim()
def similarityReleaseKeyPassword =
        (similarityInjectedKeyPassword ?: System.getenv("SIMILARITY_KEY_PASSWORD") ?: similarityKeystoreProps.getProperty("keyPassword"))?.trim()

def similarityReleaseSigningConfigured =
        similarityReleaseStoreFile && similarityReleaseStorePassword && similarityReleaseKeyAlias && similarityReleaseKeyPassword

android {
    namespace 'com.yayahiwo.similarity'
    compileSdk 34

    defaultConfig {
        applicationId "com.yayahiwo.similarity"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fexceptions -frtti"
            }
        }
    }

    signingConfigs {
        release {
            if (similarityReleaseSigningConfigured) {
                storeFile file(similarityReleaseStoreFile)
                storePassword similarityReleaseStorePassword
                keyAlias similarityReleaseKeyAlias
                keyPassword similarityReleaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // Maximize release optimizations (R8 shrinking/obfuscation + resource shrinking).
            minifyEnabled true
            shrinkResources true
            // For local/dev builds, don't require a release keystore. If a release keystore is
            // configured (keystore.properties / env vars / Android Studio injected signing),
            // use it; otherwise sign with the default debug keystore so Android Studio/CLI builds
            // don't fail.
            signingConfig similarityReleaseSigningConfigured ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}

dependencies {
    implementation 'androidx.navigation:navigation-fragment-ktx:2.5.3'
    implementation 'androidx.room:room-runtime:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.bumptech.glide:glide:4.13.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
}

// Android Gradle Plugin doesn't expose the Java plugin's `testClasses` task.
// Provide a small compatibility alias for CI/scripts that expect it.
if (tasks.findByName("testClasses") == null) {
    tasks.register("testClasses") {
        dependsOn("testDebugUnitTest")
    }
}
